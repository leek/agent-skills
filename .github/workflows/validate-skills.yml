name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'types/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.claude-plugin/**'
      - '.github/workflows/validate-skills.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'types/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.claude-plugin/**'
      - '.github/workflows/validate-skills.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the collection verifier
        run: |
          python3 -m pip install --quiet pyyaml
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          npm install -g --silent @anthropic-ai/claude-code
          bash scripts/verify-skills-collection.sh
