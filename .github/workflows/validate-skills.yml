name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'types/**'
      - 'docs/**'
      - 'template/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.claude-plugin/**'
      - '.github/workflows/validate-skills.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'types/**'
      - 'docs/**'
      - 'template/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.claude-plugin/**'
      - '.github/workflows/validate-skills.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the collection verifier
        run: |
          python3 -m pip install --quiet pyyaml
          # ripgrep for the checks; jq, perl, tmux, and git for the skills/*/scripts/test-*.sh the verifier runs
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep jq tmux
          npm install -g --silent @anthropic-ai/claude-code
          bash scripts/verify-skills-collection.sh

  macos-shell-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shell and Python tests on stock macOS /bin/bash
        run: |
          # The verifier and the tests it runs call bare `bash`, which PATH resolves to the
          # runner's Homebrew Bash 5; put stock /bin/bash (3.2) first so every level runs 3.2.
          mkdir -p "$RUNNER_TEMP/stock-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/stock-bash/bash"
          export PATH="$RUNNER_TEMP/stock-bash:$PATH"
          bash --version | head -n 1
          VERIFY_ONLY="bash -n" /bin/bash scripts/verify-skills-collection.sh
          VERIFY_ONLY="test-*.sh" /bin/bash scripts/verify-skills-collection.sh
          VERIFY_ONLY="python" /bin/bash scripts/verify-skills-collection.sh
          VERIFY_ONLY="bare-worktree" /bin/bash scripts/verify-skills-collection.sh
          VERIFY_ONLY="scratch-state.sh" /bin/bash scripts/verify-skills-collection.sh
